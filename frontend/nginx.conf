
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward backend API and application routes
    location ~ ^/(api|admin|admin-login|admin-logout|officer|officers|check-whitelist|send-otp|verify-otp|check-auth|check-admin-session|founder-logout|submit-grievance|my-grievances|all-grievances|update-status|grievance|analytics|faq|health|test|gemini-assist|debug)(/|$) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
